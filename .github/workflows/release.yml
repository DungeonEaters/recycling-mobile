name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "test: build a pre-release image. release: cut an official SemVer release"
        required: true
        type: choice
        options: [test, release]
        default: test
      version:
        description: "SemVer version. test: X.Y.Z or X.Y.Z-rc.N. release: strict X.Y.Z only (no suffix)"
        required: true
        type: string
      ref:
        description: "Branch, tag or commit to build"
        required: false
        type: string
        default: main
      api_url:
        description: "Public API URL embedded in the build"
        required: true
        type: string
        default: https://api.example.com

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.channel }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  test-channel:
    name: Build and publish test image
    if: inputs.channel == 'test'
    runs-on: ubuntu-latest
    steps:
      - name: Validate SemVer version
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "::error::version must be SemVer, e.g. 0.2.0 or 0.2.0-rc.1"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: image
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_URL=${{ inputs.api_url }}
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}:test-${{ inputs.version }}
            ghcr.io/${{ steps.image.outputs.repository }}:sha-${{ github.sha }}

  release-channel:
    name: Tag, build and publish release
    if: inputs.channel == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Validate strict SemVer (no pre-release suffix)
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Release channel requires strict SemVer X.Y.Z, no pre-release suffix. Got: ${{ inputs.version }}"
            exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
      - id: image
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_URL=${{ inputs.api_url }}
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}:release-v${{ inputs.version }}
            ghcr.io/${{ steps.image.outputs.repository }}:latest
            ghcr.io/${{ steps.image.outputs.repository }}:sha-${{ github.sha }}
      - name: Create GitHub Release
        run: gh release create "v${{ inputs.version }}" --generate-notes --title "v${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
