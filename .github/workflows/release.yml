name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test version (SemVer pre-release), e.g. 0.2.0-rc.1"
        required: true
        type: string
      ref:
        description: "Branch, tag or commit to build"
        required: false
        type: string
        default: main
      api_url:
        description: "Public API URL embedded in the build"
        required: true
        type: string
        default: https://api.example.com
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  test-channel:
    name: Publish test image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate SemVer pre-release version
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$' || {
            echo "::error::version must be SemVer pre-release, e.g. 0.2.0-rc.1"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: image
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_URL=${{ inputs.api_url }}
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}:test-${{ inputs.version }}
            ghcr.io/${{ steps.image.outputs.repository }}:sha-${{ github.sha }}

  release-channel:
    name: Publish release image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Validate SemVer release tag (no pre-release suffix)
        run: |
          echo "${{ github.ref_name }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Release tags must be plain SemVer (vX.Y.Z), no pre-release suffix. Use the workflow_dispatch test channel for pre-releases."
            exit 1; }
      - uses: actions/checkout@v4
      - id: image
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_URL=https://api.${{ vars.APP_DOMAIN || 'example.com' }}
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}:release-${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.repository }}:latest
            ghcr.io/${{ steps.image.outputs.repository }}:sha-${{ github.sha }}
      - name: Create GitHub Release if missing
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" --generate-notes --title "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
